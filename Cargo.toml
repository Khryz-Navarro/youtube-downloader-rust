[package]
name = "yt-downloader"
version = "0.1.7"
description = "Desktop YouTube downloader built on yt-dlp"
authors = ["Khryz"]
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
url = "2"
trash = "5"
arboard = { version = "3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
